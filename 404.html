<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Halaman Tidak Ditemukan | BelajarPlus Tutorial</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/belajar-plus-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Background blur blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 500px; height: 500px; background: #3b82f6; top: -100px; left: -100px; }
    .blob-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -80px; right: -80px; }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 540px;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 2.5rem;
      text-decoration: none;
    }
    .logo-wrap img { height: 32px; width: auto; }
    .logo-badge {
      background: rgba(37,99,235,.2);
      border: 1px solid #3b82f6;
      color: #60a5fa;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .error-code {
      font-size: clamp(7rem, 20vw, 10rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 0.5rem;
      user-select: none;
    }

    .error-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: wobble 2s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-8deg); }
      50%       { transform: rotate(8deg); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(37,99,235,.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37,99,235,.5);
    }

    .btn-secondary {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.25);
      color: #fff;
    }

    .quick-links {
      margin-top: 3rem;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .quick-link {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .quick-link:hover {
      background: rgba(59,130,246,.15);
      border-color: rgba(59,130,246,.4);
      color: #60a5fa;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 2px;
      margin: 2rem auto 0;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <a href="/" class="logo-wrap">
      <img src="/assets/belajar-plus-logo.png" alt="BelajarPlus Logo" />
      <span class="logo-badge">Tutorial</span>
    </a>

    <div class="error-code">404</div>
    <div class="error-icon">📚</div>

    <h1>Halaman Tidak Ditemukan</h1>
    <p>
      Sepertinya buku yang kamu cari tidak ada di rak ini.<br />
      URL mungkin salah ketik atau halaman sudah dipindahkan.
    </p>

    <div class="btn-group">
      <a href="/" class="btn-primary">🏠 Kembali ke Beranda</a>
      <a href="https://belajarplus.id/library" target="_blank" class="btn-secondary">Buka BelajarPlus ↗</a>
    </div>

    <div class="quick-links">
      <a href="/#pengenalan" class="quick-link">📖 Pengenalan</a>
      <a href="/#cara-pakai" class="quick-link">🚀 Cara Pakai</a>
      <a href="/#reader-demo" class="quick-link">📗 Book Reader</a>
      <a href="/#faq" class="quick-link">❓ FAQ</a>
    </div>

    <div class="divider"></div>
  </div>
</body>
</html>
